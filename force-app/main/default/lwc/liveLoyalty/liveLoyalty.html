<template>

    <lightning-card title={label.live}>

        <template lwc:if={hasOrders}>
            
            <lightning-layout vertical-direction="vertical" multiple-rows class="slds-var-m-around_medium">

                <template for:each={orders} for:item="order">

                    <lightning-layout-item key={order.id} size="12" class="slds-var-m-bottom_small">
                        
                        <div class="slds-box slds-box_x-small slds-text-align_left">
                            
                            <lightning-layout vertical-direction="vertical" multiple-rows>
                                
                                <lightning-layout-item size="12" class="slds-var-p-around_xx-small slds-text-heading_medium">
                                    {label.date}: {order.date}
                                </lightning-layout-item>

                                <lightning-layout-item size="12" class="slds-var-p-around_xx-small slds-text-heading_medium">
                                    {label.currency}: {order.currency}
                                </lightning-layout-item>

                                <lightning-layout-item size="12" class="slds-var-p-around_xx-small slds-text-heading_medium">
                                    {label.pointsBig}: {order.points} {label.points}
                                </lightning-layout-item>

                            </lightning-layout>

                        </div>
                    </lightning-layout-item>

                </template>
            </lightning-layout>
        </template>

        <h1 lwc:else class="slds-text-heading_medium slds-text-align_center">{label.purchases}</h1>

    </lightning-card>
</template>
